  /* ///--- 0. ROOT BRIEF CHI TIẾT -------------------------------------------
     Layout: max 920 container, 1040 hero, 760 chapter.
     Màu: cream #fbf9f4, cream-2 #f3efe7, sand #e9e1d5, ink #24211e, gold #b79a6d,
          wine #5c2630 (move. màu đỏ rượu).
     Font: h1/h2/h3 Playfair 600 nguyên bản file121, body Be Vietnam 300 15.5/1.95,
           Manrope 800 cho MAKE IT, Instrument Serif italic cho move.
     Padding: hero 150 26 90, chapter 86 26, closing 90 26, card 22 24 radius 16.
     Muốn đổi nhanh: sửa biến --cream/--gold/--wine, hoặc .hero h1 clamp, .chapter h2 clamp.
     Thêm block mới: xem comment [F] đầu file - copy form chapter / proj-card / metric-row.
  --------------------------------------------------------------------------- */

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Be+Vietnam+Pro:wght@300;400&family=Manrope:wght@400;700;800&family=Instrument+Serif:ital@0;1&display=swap');

  /* ///--- 1. BIẾN MÀU & FONT - BRIEF ---------------------------------------
     --cream nền chính, --sand border, --gold accent line + chip, --wine đỏ cho move.
     Font serif 600 trả nguyên file121, không mỏng như v32.
     Đổi màu nhanh: sửa --wine để đổi màu move., --gold để đổi chip + line.
  --------------------------------------------------------------------------- */
  :root{
    --cream:#fbf9f4; --cream-2:#f3efe7; --sand:#e9e1d5;
    --ink:#24211e; --ink-soft:#514c46; --ink-faint:#9ca3af;
    --gold:#b79a6d; --gold-light:#d8c8a8; --gold-pale:#ead9bb;
    --wine:#5c2630; --wine-soft:#7c4650;
    --font-serif:'Playfair Display', serif;
    --font-sans:'Be Vietnam Pro','DM Sans', sans-serif;
    --font-display:'Manrope', sans-serif;
    --font-italic:'Instrument Serif', 'Playfair Display', serif;
    --ease-slow:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --dur-slow:1.4s;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ///--- 2. RESET & REVEAL - BRIEF ----------------------------------------
     Body 300, p 15.5/1.95 soft, h1/h2/h3 serif 600 nguyên bản.
     Reveal opacity 0 translateY 30px -> in, delay i%3*0.08s max 0.24s.
     Progress bar scaleX theo scrollY / (docH - winH).
  --------------------------------------------------------------------------- */
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:90px;}
  html,body{height:100%}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:var(--font-sans); font-weight:300; letter-spacing:.01em;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:var(--font-serif); font-weight:600; margin:0;}
  ::selection{background:var(--gold); color:#fff}
  a{color:inherit; text-decoration:none}
  .container{max-width:920px; margin:0 auto; padding:0 26px;}
  .alt-bg{background:var(--cream-2);}
  .reveal{opacity:0; transform:translateY(30px); transition:opacity var(--dur-slow) var(--ease-slow), transform var(--dur-slow) var(--ease-slow);}
  .reveal.in{opacity:1; transform:none;}
  .kicker{font-size:11.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; font-weight:400;}

  .progress{position:fixed; top:0; left:0; right:0; height:2px; z-index:100; pointer-events:none; transform-origin:left;}
  .progress-bar{width:100%; height:100%; background:linear-gradient(90deg, var(--gold), var(--wine)); transform:scaleX(0); transform-origin:left; transition:transform .1s linear;}

  /* ///--- 2b. GRAIN + ORB + CURSOR - BRIEF ----------------------------------
     Grain fixed inset opacity .035 multiply, translate theo mouse 20px.
     Orb 240px radial gold 36%/wine 8% blur 6px multiply, lerp .06 follow.
     Dot 8px wine, ring 36px gold border, scale 2.2/56px khi hover a/button/frame.
     Ripple fixed 12px radial gold/wine scale 14 .85s, particle 6px gold fly .7s.
     Tắt trên mobile <860px.
  --------------------------------------------------------------------------- */
  .grain{position:fixed; inset:0; pointer-events:none; z-index:2; opacity:.035; mix-blend-mode:multiply;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0 1px, transparent 1px 2px);
    will-change:transform;
  }
  .light-orb{
    position:fixed; left:0; top:0; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(216,200,168,.36) 0%, rgba(183,154,109,.18) 28%, rgba(92,38,48,.08) 62%, transparent 76%);
    pointer-events:none; z-index:3; filter:blur(6px); mix-blend-mode:multiply;
    opacity:.9; will-change:transform; transition:opacity .4s, transform .12s linear;
  }
  .light-orb.flash{opacity:1; filter:blur(2px); transform:translate3d(var(--ox,0),var(--oy,0),0) scale(1.35)!important;}

  .cursor-dot{width:8px; height:8px; background:var(--wine); border-radius:50%; position:fixed; left:0; top:0; pointer-events:none; z-index:9999; transition:transform .18s var(--ease-out), opacity .2s;}
  .cursor-dot.hover{transform:translate3d(var(--x,0),var(--y,0),0) scale(2.2)!important; opacity:.8;}
  .cursor-ring{width:36px; height:36px; border:1.2px solid var(--gold); border-radius:50%; position:fixed; left:0; top:0; pointer-events:none; z-index:9998; transition:width .3s var(--ease-out), height .3s var(--ease-out), border-color .3s, transform .15s linear;}
  .cursor-ring.hover{width:56px; height:56px; border-color:var(--wine); margin:-10px 0 0 -10px;}
  @media(max-width:860px){.cursor-dot,.cursor-ring,.grain,.light-orb{display:none}}

  .touch-ripple{
    position:fixed; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
    background:radial-gradient(circle, rgba(183,154,109,.55) 0%, rgba(92,38,48,.18) 48%, transparent 72%);
    pointer-events:none; z-index:9997; animation:rippleExpand .85s var(--ease-out) forwards;
  }
  @keyframes rippleExpand{
    0%{transform:scale(1); opacity:.9}
    100%{transform:scale(14); opacity:0}
  }
  .particle{
    position:fixed; width:6px; height:6px; border-radius:50%; background:var(--gold);
    pointer-events:none; z-index:9996; margin:-3px 0 0 -3px;
    animation:particleFly .7s var(--ease-out) forwards;
  }
  @keyframes particleFly{
    0%{transform:translate(0,0) scale(1); opacity:1}
    100%{transform:translate(var(--tx), var(--ty)) scale(0); opacity:0}
  }

  /* ///--- 3. NAV + MENU PANEL - BRIEF --------------------------------------
     Nav fixed top blur 12px gradient cream 92%->0, scrolled blur 18px shadow 8 30.
     Navrow max 920 padding 20 26 flex space-between.
     Brand Playfair 600 18px, span gold italic.
     Menu-btn ink pill 10 16 radius 999 uppercase 11.5px, hover wine.
     Overlay transparent click để đóng, panel fixed top 72 right 14 width min 300 84vw
     max-h 64vh bg rgba 251 249 244 .78 blur 22 saturate 1.5 border rgba 0 0 0 .06 radius 16
     shadow 18 60 ink .14 + inset white .55, opacity 0 translateY -10 scale .98 -> open.
     Summary Playfair 600 14px + pseudo + rotate 45deg, sub 12.5px dotted left.
  --------------------------------------------------------------------------- */
  nav{position:fixed; top:0; left:0; right:0; z-index:80; padding-top:env(safe-area-inset-top,0px);
      background:linear-gradient(to bottom, rgba(251,249,244,.92) 0%, rgba(251,249,244,.72) 55%, rgba(251,249,244,0) 100%);
      backdrop-filter:blur(12px) saturate(1.2); -webkit-backdrop-filter:blur(12px) saturate(1.2);
      border-bottom:1px solid rgba(233,225,213,.8);
      transition:background .6s var(--ease-slow), backdrop-filter .6s var(--ease-slow), box-shadow .6s var(--ease-slow), border-color .6s;}
  nav.scrolled{background:rgba(251,249,244,.92); backdrop-filter:blur(18px) saturate(1.35); -webkit-backdrop-filter:blur(18px) saturate(1.35);
               box-shadow:0 8px 30px rgba(36,33,30,.06); border-bottom-color:rgba(233,225,213,1);}
  .navrow{max-width:920px; margin:0 auto; padding:20px 26px; display:flex; justify-content:space-between; align-items:center;}
  .brand{font-family:var(--font-serif); font-size:18px; font-weight:600; letter-spacing:.01em; cursor:pointer;}
  .brand span{color:var(--gold); font-style:italic;}
  .menu-btn{
    display:flex; align-items:center; gap:9px; background:var(--ink); color:var(--cream);
    border:none; padding:10px 16px; border-radius:999px; font-family:var(--font-sans);
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; font-weight:400;
    transition:background .5s var(--ease-slow), transform .4s var(--ease-out);
  }
  .menu-btn:hover{background:var(--wine);}
  .menu-btn .bar{width:14px;height:1.2px;background:currentColor;position:relative;}
  .menu-btn .bar::before,.menu-btn .bar::after{content:"";position:absolute;left:0;width:100%;height:1.2px;background:currentColor;}
  .menu-btn .bar::before{top:-4px;} .menu-btn .bar::after{top:4px;}

  .menu-overlay{position:fixed; inset:0; z-index:85; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; opacity:0; pointer-events:none; transition:opacity .35s var(--ease-slow);}
  .menu-overlay.open{opacity:1; pointer-events:auto;}
  .menu-panel{
    position:fixed; top:calc(72px + env(safe-area-inset-top,0px)); right:14px; z-index:90;
    width:min(300px, 84vw); max-height:min(64vh, 520px); overflow-y:auto;
    background:rgba(251,249,244,.78); backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid rgba(0,0,0,.06); border-radius:16px;
    box-shadow:0 18px 60px rgba(36,33,30,.14), 0 0 0 1px rgba(255,255,255,.55) inset;
    padding:10px 8px; opacity:0; transform:translateY(-10px) scale(.98); pointer-events:none;
    transition:opacity .4s var(--ease-slow), transform .4s var(--ease-slow);
  }
  .menu-panel.open{opacity:1; transform:none; pointer-events:auto;}
  .menu-group{border-bottom:1px solid rgba(233,225,213,.6);}
  .menu-group:last-child{border-bottom:none;}
  .menu-group summary{list-style:none; cursor:pointer; padding:12px 12px; display:flex; justify-content:space-between; align-items:center; font-family:var(--font-serif); font-size:14px; font-weight:600;}
  .menu-group summary::-webkit-details-marker{display:none;}
  .menu-group summary::after{content:"+"; color:var(--gold); font-size:16px; transition:transform .35s var(--ease-out);}
  .menu-group[open] summary::after{transform:rotate(45deg);}
  .menu-sub{display:block; padding:7px 10px 7px 18px; font-size:12.5px; font-weight:300; color:var(--ink-soft); border-left:1px dotted var(--sand); margin:0 10px 6px; transition:color .3s;}
  .menu-sub:hover{color:var(--wine);}

  /* ///--- 4. HERO - BRIEF --------------------------------------------------
     Padding 150 26 90 max 1040 grid gap 56, >=860px 1.15fr .85fr align center.
     H1 Playfair 600 clamp 34-58 line 1.06 ls -.01em mb 24, em italic wine 600.
     P Be Vietnam 300 15.5/1.95 soft max 520, rule 56x2 gold mb 28.
     Muốn đổi size tiêu đề: sửa clamp trong .hero h1.
  --------------------------------------------------------------------------- */
  .hero{padding:150px 26px 90px; max-width:1040px; margin:0 auto; display:grid; gap:56px; position:relative; z-index:1;}
  @media(min-width:860px){.hero{grid-template-columns:1.15fr .85fr; align-items:center;}}
  .hero h1{font-family:var(--font-serif); font-size:clamp(34px,5.6vw,58px); line-height:1.06; letter-spacing:-.01em; margin-bottom:24px; font-weight:600;}
  .hero h1 em{color:var(--wine); font-style:italic; font-weight:600;}
  .hero p{font-size:15.5px; line-height:1.95; font-weight:300; color:var(--ink-soft); max-width:520px;}
  .hero-rule{width:56px; height:2px; background:var(--gold); margin:28px 0; border-radius:2px;}

  /* ///--- 5. CARD VISIT - BRIEF --------------------------------------------
     Stage perspective 1200 min-h 300 flex center column.
     Tilt-wrap preserve-3d transition .15s, transform rotateX/Y theo mouse.
     Biz-card width 320 aspect 1.58 radius 16 preserve-3d transition transform .9s
       cubic-bezier .22,1,.36,1, float 5.8s infinite translateY 0->-9px, cursor pointer.
       is-flipped rotateY 180deg, touched pulse scale 1->1.04 .6s.
     Card-face absolute inset 0 radius 16 backface hidden border 1 sand
       shadow 22 60 ink .10 + gold .22 + inset white .9.
       Front: radial 420 circle gold-pale 55% at 82% -10% + radial gold 18% + linear 108deg cream.
       Back: radial 380 gold-pale 45% + linear cream.
       Shimmer ::after white sweep -120% -> 120% skew -12deg 1.2s on hover.
     Chip 38x28 radius 5 gradient gold #e8d8b8->#a88a5c inset white .8 + black .18,
       lines border 1 black .12 + ::before/::after horizontal 34%/66% + v line 52%.
       Shine ::before gradient white 28% chạy -60%->60% 3.8s.
     QR: box 76 white border sand radius 8 padding 6 shadow 4 14 .06, grid 9x9 gap 1px
       cell white / on ink / gold.
     Back email pill wine bg 6% dashed 18% hover 10% translateY -1px, copy on click.
     Shadow 210x30 radial ink .18 blur 12.
     Muốn đổi email: sửa const email ở JS.
     Muốn đổi màu chip: sửa .chip background linear.
  --------------------------------------------------------------------------- */
  .card-stage{perspective:1200px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; position:relative;}
  .tilt-wrap{transform-style:preserve-3d; transition:transform .15s ease-out; will-change:transform;}
  .biz-card{
    width:320px; aspect-ratio:1.58/1; border-radius:16px; position:relative;
    transform-style:preserve-3d; transition:transform .9s cubic-bezier(.22,1,.36,1);
    animation:cardFloat 5.8s ease-in-out infinite;
    cursor:pointer; user-select:none;
  }
  .biz-card.is-flipped{transform:rotateY(180deg);}
  @keyframes cardFloat{0%,100%{transform:translateY(0) rotateY(0deg);}50%{transform:translateY(-9px) rotateY(0deg);}}
  .biz-card.touched{animation:cardPulse .6s var(--ease-out);}
  @keyframes cardPulse{0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)}}
  .biz-card.is-flipped.touched{animation:cardPulseFlipped .6s var(--ease-out);}
  @keyframes cardPulseFlipped{0%{transform:rotateY(180deg) scale(1)} 40%{transform:rotateY(180deg) scale(1.04)} 100%{transform:rotateY(180deg) scale(1)}}

  .card-face{
    position:absolute; inset:0; border-radius:16px; padding:22px 24px; display:flex; flex-direction:column; justify-content:space-between;
    backface-visibility:hidden; overflow:hidden;
    border:1px solid rgba(233,225,213,.9);
    box-shadow:0 22px 60px rgba(45,34,25,.10), 0 1px 0 rgba(183,154,109,.22), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .card-face.front{
    background:
      radial-gradient(420px circle at 82% -10%, rgba(234,217,187,.55), transparent 60%),
      radial-gradient(320px circle at -10% 120%, rgba(183,154,109,.18), transparent 60%),
      linear-gradient(108deg, #fdfcf9 0%, #fbf9f4 52%, #f6f0e6 100%);
  }
  .card-face.front::after{
    content:""; position:absolute; inset:0; border-radius:16px; pointer-events:none;
    background:linear-gradient(110deg, transparent 0%, transparent 38%, rgba(255,255,255,.85) 50%, transparent 62%, transparent 100%);
    transform:translateX(-120%) skewX(-12deg); opacity:.0;
    transition:transform 1.2s var(--ease-slow), opacity .6s;
  }
  .biz-card:hover .card-face.front::after{transform:translateX(120%) skewX(-12deg); opacity:.9; transition:transform 1.2s var(--ease-slow);}
  .card-face.back{
    background:
      radial-gradient(380px circle at 20% 0%, rgba(234,217,187,.45), transparent 62%),
      linear-gradient(180deg, #fdfcfa 0%, #fbf9f4 100%);
    transform:rotateY(180deg);
  }

  .bc-top{font-family:var(--font-sans); color:var(--gold); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; font-weight:400; display:flex; justify-content:space-between; align-items:center;}
  .bc-chip-row{display:flex; align-items:center; gap:14px; margin:14px 0 8px;}
  .chip{
    width:38px; height:28px; border-radius:5px; position:relative;
    background:linear-gradient(135deg, #e8d8b8 0%, #d8c8a8 18%, #b79a6d 58%, #a88a5c 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.8), inset 0 -1px 2px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
    overflow:hidden;
  }
  .chip::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent 45%, rgba(255,255,255,.28) 50%, transparent 55%); animation:chipShine 3.8s ease-in-out infinite;}
  @keyframes chipShine{0%,70%{transform:translateX(-60%)} 100%{transform:translateX(60%)}}
  .chip-lines{position:absolute; inset:3px; border-radius:3px; border:1px solid rgba(0,0,0,.12);}
  .chip-lines::before,.chip-lines::after{content:""; position:absolute; left:0; right:0; height:1px; background:rgba(0,0,0,.12);}
  .chip-lines::before{top:34%} .chip-lines::after{top:66%}
  .chip-v{position:absolute; top:0; bottom:0; width:1px; background:rgba(0,0,0,.12); left:52%;}
  .bc-name{font-family:var(--font-display); color:var(--ink); font-size:28px; font-weight:800; letter-spacing:-.04em; line-height:.9; margin-top:2px;}
  .bc-role{color:var(--ink-soft); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-top:6px; font-weight:400;}
  .bc-bottom{display:flex; justify-content:space-between; align-items:flex-end; color:var(--ink-faint); font-size:9.5px; letter-spacing:.12em; font-weight:400;}
  .bc-number{font-family:var(--font-sans); letter-spacing:.18em; font-size:9px; color:var(--ink-faint);}

  .back-main{display:flex; gap:16px; align-items:center; margin-top:6px;}
  .qr-box{width:76px; height:76px; background:white; border:1px solid var(--sand); border-radius:8px; padding:6px; box-shadow:0 4px 14px rgba(0,0,0,.06); flex-shrink:0;}
  .qr-grid{width:100%; height:100%; display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); gap:1px;}
  .qr-cell{background:white;}
  .qr-cell.on{background:var(--ink);}
  .qr-cell.gold{background:var(--gold);}
  .back-info{flex:1;}
  .back-name{font-family:var(--font-serif); font-weight:600; font-size:20px; letter-spacing:-.01em; color:var(--ink);}
  .back-email{
    margin-top:6px; font-size:11px; color:var(--wine); background:rgba(92,38,48,.06);
    padding:5px 8px; border-radius:6px; border:1px dashed rgba(92,38,48,.18);
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; transition:all .3s;
  }
  .back-email:hover{background:rgba(92,38,48,.10); transform:translateY(-1px);}
  .back-list{margin:10px 0 0; display:flex; flex-direction:column; gap:4px;}
  .back-list span{font-size:11px; letter-spacing:.02em; color:var(--ink-soft); display:flex; justify-content:space-between; font-weight:300;}
  .back-list b{color:var(--ink); font-weight:400;}

  .card-shadow{width:210px; height:30px; background:radial-gradient(ellipse at center, rgba(36,26,18,.18), transparent 70%); filter:blur(12px); border-radius:50%; margin-top:28px; transition:transform .15s ease-out, opacity .3s; will-change:transform;}

  /* ///--- 5b. TOAST - BRIEF --------------------------------------------------
     Fixed bottom center 28px, translateX -50% + Y 10->0, bg ink text cream pill
     radius 999 padding 10 18 size 12px opacity 0->1 .4s ease-out.
  --------------------------------------------------------------------------- */
  .toast{position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--cream); padding:10px 18px; border-radius:999px; font-size:12px; letter-spacing:.02em; z-index:120; opacity:0; pointer-events:none; transition:all .4s var(--ease-out); box-shadow:0 12px 30px rgba(0,0,0,.18);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ///--- 6. CHAPTERS - BRIEF ------------------------------------------------
     Max 760 auto padding 86 26 relative z 1.
     ch-num serif italic 13px wine uppercase .08em mb 10 weight 600.
     h2 serif 600 clamp 26-38 ls -.015em line 1.08 mb 26 - nguyên bản file121.
     p sans 300 15.5/1.95 soft mb 20, b ink 600.
     lead serif italic 19px ink 1.55 weight 500 mt 26.
     Thêm chương mới: copy nguyên <section class="chapter"> này đổi id/ch-num/h2/p.
  --------------------------------------------------------------------------- */
  .chapter{max-width:760px; margin:0 auto; padding:86px 26px; position:relative; z-index:1;}
  .ch-num{font-family:var(--font-serif); font-style:italic; font-size:13px; color:var(--wine); letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; font-weight:600;}
  .chapter h2{font-family:var(--font-serif); font-size:clamp(26px,4.6vw,38px); margin-bottom:26px; letter-spacing:-.015em; font-weight:600; line-height:1.08;}
  .chapter h3{font-family:var(--font-serif); font-weight:600;}
  .chapter p{font-size:15.5px; line-height:1.95; font-weight:300; color:var(--ink-soft); margin:0 0 20px;}
  .chapter p b{color:var(--ink); font-weight:600;}
  .lead{font-family:var(--font-serif); font-style:italic; font-size:19px; color:var(--ink); line-height:1.55; font-weight:500;}

  /* ///--- 6b. QUOTE FLOAT - BRIEF -------------------------------------------
     Margin 40 auto max 640 padding 32 36 bg cream radius 6 26 shadow 26 50 wine .28 + 2px gold line
     Serif italic 19-24 1.5 wine weight 500 relative transition .6s.
     Hover translateY -4 scale 1.01 shadow 32 70 .32.
     Touched thêm border gold 25% scale 1.02 khi pointerdown.
     ::before “ 56px gold-light absolute -10 18.
     Copy để thêm quote mới: <blockquote class="quote-float">...</blockquote>
  --------------------------------------------------------------------------- */
  .quote-float{
    margin:40px auto; max-width:640px; padding:32px 36px; background:var(--cream);
    border-radius:6px 26px 6px 26px; box-shadow:0 26px 50px -20px rgba(92,38,48,.28), 0 2px 0 var(--gold);
    font-family:var(--font-serif); font-style:italic; font-size:clamp(19px,3vw,24px);
    line-height:1.5; color:var(--wine); position:relative; font-weight:500;
    transition:transform .6s var(--ease-out), box-shadow .6s var(--ease-out);
    will-change:transform;
  }
  .quote-float:hover{transform:translateY(-4px) scale(1.01); box-shadow:0 32px 70px -20px rgba(92,38,48,.32), 0 2px 0 var(--gold);}
  .quote-float.touched{transform:translateY(-4px) scale(1.02); box-shadow:0 32px 70px -20px rgba(92,38,48,.32), 0 0 0 1px rgba(183,154,109,.25), 0 2px 0 var(--gold);}
  .quote-float::before{content:"“"; position:absolute; top:-10px; left:18px; font-size:56px; color:var(--gold-light); font-family:var(--font-serif);}

  /* ///--- 6c. FRAME - BRIEF --------------------------------------------------
     Margin 44 auto max 600 border 1.5 gold radius 50 8 50 8 padding 5 bg sand
     preserve-3d transition transform .6s + shadow, cursor pointer relative --mx/--my.
     is-hover shadow 22 64 ink .16, touched border wine + 0 0 0 3px wine .12.
     ::after radial 380 white .38 at --mx/--my opacity 0->1.
     Inner radius 46 4 min-h 230 flex center gap 10 faint repeating linear 135deg
       transparent 13px cream-2 1px translateZ 20.
     Muốn thêm ảnh: thay .frame-inner bằng <img class="frame-img" src...>
     .frame-img width 100% height 100% cover radius 46 4.
  --------------------------------------------------------------------------- */
  .frame{
    --mx:50%; --my:50%;
    margin:44px auto; max-width:600px; border:1.5px solid var(--gold); border-radius:50px 8px 50px 8px; padding:5px; background:var(--sand);
    transform-style:preserve-3d; transition:transform .6s cubic-bezier(.22,1,.36,1), box-shadow .6s var(--ease-slow), border-color .4s;
    will-change:transform; cursor:pointer; position:relative;
  }
  .frame.is-hover{box-shadow:0 22px 64px rgba(36,33,30,.16);}
  .frame.touched{border-color:var(--wine); box-shadow:0 0 0 3px rgba(92,38,48,.12), 0 22px 64px rgba(36,33,30,.16);}
  .frame::after{
    content:""; position:absolute; inset:0; border-radius:50px 8px 50px 8px; pointer-events:none;
    background:radial-gradient(380px circle at var(--mx) var(--my), rgba(255,255,255,.38), transparent 62%);
    opacity:0; transition:opacity .45s var(--ease-slow);
  }
  .frame.is-hover::after{opacity:1;}
  .frame-inner{
    border-radius:46px 4px 46px 4px; min-height:230px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; color:var(--ink-faint);
    background:repeating-linear-gradient(135deg, transparent, transparent 13px, var(--cream-2) 13px, var(--cream-2) 14px);
    transform:translateZ(20px); transition:transform .6s var(--ease-out); will-change:transform;
  }
  .frame-img{width:100%; height:100%; object-fit:cover; border-radius:46px 4px 46px 4px; display:block;}
  @media(max-width:600px){.frame:active{transform:perspective(1000px) scale(.98)!important;}}

  /* ///--- 7. TIMELINE + PRINCIPLES + METRICS - BRIEF -------------------------
     Timeline border-left 1 sand pl 28 gap 34, item ::before 10 gold dot shadow 4 cream-2.
     tl-tag 11 .16em uppercase gold 600 mb 8, h3 18 600 mb 8, p 14/1.75 300, cat 10 .12em uppercase
       bg gold-pale text wine padding 5 10 radius 999 600.
     Principles flex column gap 22 mt 30, n serif gold 14 600 min 22, p 14.5/1.75 300.
     Metric-row grid gap 18 mt 34, 680px 1fr 1fr, card cream border sand radius 8 22 padding 20
       transition .6s hover translateY -4 shadow 18 40 .08, touched gold border scale 1.02.
     tag2 10 .14em uppercase wine 600 mb 10, p 13/1.7 300.
     Copy để thêm: timeline thêm .tl-item, principles thêm .principle, metric thêm .metric-card trong .metric-row.
  --------------------------------------------------------------------------- */
  .timeline{margin:46px 0 0; border-left:1px solid var(--sand); padding-left:28px; display:flex; flex-direction:column; gap:34px;}
  .tl-item{position:relative;}
  .tl-item::before{content:""; position:absolute; left:-34px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px var(--cream-2);}
  .tl-tag{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:8px;}
  .tl-item h3{font-size:18px; margin-bottom:8px; font-weight:600;}
  .tl-item p{font-size:14px; line-height:1.75; margin:0; font-weight:300;}
  .cat{margin-top:10px; display:inline-block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; background:var(--gold-pale); color:var(--wine); padding:5px 10px; border-radius:999px; font-weight:600;}

  .principles{display:flex; flex-direction:column; gap:22px; margin:30px 0;}
  .principle{display:flex; gap:14px;}
  .principle .n{font-family:var(--font-serif); color:var(--gold); font-size:14px; font-weight:600; min-width:22px;}
  .principle p{margin:0; font-size:14.5px; line-height:1.75; font-weight:300;}
  .metric-row{display:grid; gap:18px; margin-top:34px;}
  @media(min-width:680px){.metric-row{grid-template-columns:1fr 1fr;}}
  .metric-card{background:var(--cream); border:1px solid var(--sand); border-radius:8px 22px 8px 22px; padding:20px; transition:transform .6s var(--ease-out), box-shadow .6s var(--ease-out), border-color .4s;}
  .metric-card:hover{transform:translateY(-4px); box-shadow:0 18px 40px rgba(36,33,30,.08);}
  .metric-card.touched{transform:translateY(-4px) scale(1.02); border-color:var(--gold); box-shadow:0 18px 40px rgba(36,33,30,.12);}
  .tag2{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--wine); font-weight:600; margin-bottom:10px;}
  .metric-card p{font-size:13px; line-height:1.7; margin:0; font-weight:300;}

  /* ///--- 8. SLIDER PROJECTS - BRIEF ----------------------------------------
     Head max 920 padding 0 26 z1, drag-hint flex gap 8 11 .08em uppercase faint 300 mt 20 mb 4.
     Wrap overflow-x auto grab padding 14 26 34 scroll-snap x proximity thin gold scrollbar.
     Track flex gap 22 width max-content, card scroll-snap start width 288 flex-shrink 0
       bg cream border sand radius 8 30 padding 20 transition .6s, ::after radial 360 white .32 at --mx/--my.
       hover shadow 30 50 -25 ink .3, touched gold border + 0 0 0 3px gold .18 scale 1.02.
     Thumb h 150 radius 6 24 dashed gold bg cream-2 flex center faint mb 16 translateZ 10.
     Tag 10 .12em uppercase wine 600 mb 8, h3 18 600 mb 8, p 13/1.65 soft 300.
     Thêm dự án: copy .proj-card vào .slider-track.
  --------------------------------------------------------------------------- */
  .slider-head{max-width:920px; margin:0 auto; padding:0 26px; position:relative; z-index:1;}
  .drag-hint{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 4px; font-weight:300;}
  .slider-wrap{overflow-x:auto; cursor:grab; padding:14px 26px 34px; scroll-snap-type:x proximity; scrollbar-width:thin; scrollbar-color:var(--gold) transparent;}
  .slider-wrap.dragging{cursor:grabbing; scroll-snap-type:none;}
  .slider-wrap::-webkit-scrollbar{height:5px;}
  .slider-wrap::-webkit-scrollbar-thumb{background:var(--sand); border-radius:6px;}
  .slider-track{display:flex; gap:22px; width:max-content;}
  .proj-card{
    scroll-snap-align:start; width:288px; flex-shrink:0; background:var(--cream);
    border:1px solid var(--sand); border-radius:8px 30px 8px 30px; padding:20px;
    transition:transform .6s var(--ease-slow), box-shadow .6s var(--ease-slow), border-color .4s;
    will-change:transform; cursor:pointer; position:relative; --mx:50%; --my:50%;
  }
  .proj-card::after{
    content:""; position:absolute; inset:0; border-radius:8px 30px 8px 30px; pointer-events:none;
    background:radial-gradient(360px circle at var(--mx) var(--my), rgba(255,255,255,.32), transparent 65%); opacity:0; transition:opacity .45s;
  }
  .proj-card.is-hover::after{opacity:1;}
  .proj-card:hover{box-shadow:0 30px 50px -25px rgba(36,33,30,.3);}
  .proj-card.touched{border-color:var(--gold); box-shadow:0 0 0 3px rgba(183,154,109,.18), 0 30px 50px -25px rgba(36,33,30,.3); transform:perspective(1000px) scale(1.02);}
  .proj-thumb{height:150px; border-radius:6px 24px 6px 24px; border:1px dashed var(--gold); background:var(--cream-2);
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint); margin-bottom:16px; transform:translateZ(10px); transition:transform .6s var(--ease-out);}
  .proj-tag{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--wine); margin-bottom:8px; font-weight:600;}
  .proj-card h3{font-size:18px; margin-bottom:8px; font-weight:600;}
  .proj-card p{font-size:13px; line-height:1.65; color:var(--ink-soft); margin:0; font-weight:300;}

  /* ///--- 9. CLOSING MAKE IT CLEAR. MAKE IT move. - BRIEF -------------------
     Max 760 auto padding 90 26 text-center z1.
     closing-title clamp 44 9vw 82 line .9 ls -.065em mb 28 weight 500 center.
     ct-line1 Playfair 500 ink normal -.03em block - "Make it clear."
     ct-line2 Manrope 800 uppercase -.04em ink .06em mt block - "MAKE IT"
       em Instrument italic 400 wine #5c2630 lowercase !important -.02em inline-block
         ::after bg wine 10% height .32em -4% right/bottom .08em radius 2 rotate -1deg z -1
         text "move." lowercase đỏ rượu - yêu cầu user.
     p 15.5/1.9 soft max 600 auto mb 16 300.
     Muốn đổi màu move.: sửa .ct-line2 em color var(--wine).
     Muốn đổi size: sửa clamp trong .closing-title.
  --------------------------------------------------------------------------- */
  .closing{max-width:760px; margin:0 auto; padding:90px 26px; text-align:center; position:relative; z-index:1;}
  .closing-title{font-size:clamp(44px, 9vw, 82px); line-height:.9; letter-spacing:-.065em; margin-bottom:28px; font-weight:500; text-align:center;}
  .ct-line1{display:block; font-family:var(--font-serif); font-weight:500; color:var(--ink); font-style:normal; letter-spacing:-.03em;}
  .ct-line2{display:block; font-family:var(--font-display); font-weight:800; text-transform:uppercase; letter-spacing:-.04em; color:var(--ink); margin-top:.06em;}
  .ct-line2 em{
    font-family:var(--font-italic); font-style:italic; font-weight:400;
    color:var(--wine); text-transform:lowercase !important; letter-spacing:-.02em;
    display:inline-block; position:relative;
  }
  .ct-line2 em::after{
    content:""; position:absolute; left:-4%; right:-4%; bottom:.08em; height:.32em;
    background:rgba(92,38,48,.10); z-index:-1; border-radius:2px; transform:rotate(-1deg);
  }
  .closing p{font-size:15.5px; line-height:1.9; color:var(--ink-soft); max-width:600px; margin:0 auto 16px; font-weight:300;}

  /* ///--- 10. FOOTER - BRIEF -------------------------------------------------
     Border-top 1 sand padding 40 26 + safe-area bottom center faint 12.5 .05em z1 300.
  --------------------------------------------------------------------------- */
  footer{border-top:1px solid var(--sand); padding:40px 26px calc(40px + env(safe-area-inset-bottom,0px));
