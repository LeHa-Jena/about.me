 0&&(i=n.ref);for(r in n)uv.call(n,r)&&!ov.hasOwnProperty(r)&&(l[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)l[r]===void 0&&(l[r]=n[r]);return{$$typeof:lv,type:e,key:u,ref:i,props:l,_owner:iv.current}}var d=kf,y=kf;var av="Tôi không bắt đầu với một khách sạn 5 sao. Tôi bắt đầu với một khách sạn nhỏ ở Bùi Viện, và một người sếp Hàn Quốc vừa từ Hàn Quốc về Việt Nam, mang theo đúng một niềm tin: làm dịch vụ cho tử tế. Năm đó, chúng tôi không có gì nhiều ngoài một tòa nhà nhỏ, vài chục phòng, và rất nhiều việc phải làm. Tôi làm đủ thứ — từ trực quầy, kiểm phòng, đến ngồi lại sau giờ để viết lại quy trình vì hôm đó khách phàn nàn. Không có SOP nào được in sẵn. SOP được viết ra từ những lần sai. Sếp tôi là người Hàn Quốc. Ông không nói nhiều về tầm nhìn. Ông chỉ nói về con số cuối tháng và về việc khách có quay lại không. Tôi học được từ ông cách nhìn một khách sạn không phải như một tòa nhà, mà như một bảng P&L đang thở. Mỗi chiếc khăn thiếu, mỗi phút check-in trễ, mỗi lời chào không đủ ấm — cuối cùng đều hiện ra ở dòng cuối cùng của báo cáo. 05 năm. Từ Bùi Viện, chúng tôi đi đến 7 khách sạn. A-IN HOTEL Vietnam — 110 phòng, hơn 1000 lượt khách mỗi năm. Không phải là chuỗi lớn nhất, nhưng là chuỗi được vận hành như một hệ thống. Tôi đi qua hết các vị trí: quản lý ca đêm, giám sát chất lượng, điều hành bộ phận, rồi cuối cùng là General Manager — người phải chịu trách nhiệm cho cả doanh thu, chi phí, và 50 đến gần 100 con người phía sau.",sv=`Rồi tôi chuyển sang golf. Nhiều người hỏi, sao từ khách sạn lại sang golf. Với tôi thì không có gì khác nhau cả. Vì cơ duyên, tôi có cơ hội làm việc với người sếp hiện tại. Ông ấy rất giỏi và làm nhiều mảng — xây dựng, sự kiện, kinh doanh — và có một CLB golf cần người chăm sóc hội viên. Đó là điểm bắt đầu của tôi. Dần dần với cái tính không chịu thua và không bao giờ hài lòng, tôi luôn tìm cách để công việc đổi mới mỗi ngày. Sếp thấy điều đó và hỗ trợ tôi rất nhiều. Giờ tôi có một team nhỏ gồm các đồng đội cùng chinh chiến trên mọi dự án.

Một giải golf, về bản chất, là một khách sạn thu nhỏ được dựng lên trong 48 giờ. Có lễ tân là bàn check-in. Có buồng phòng là tee time. Có F&B, có caddy như housekeeping, có scoring như night audit, và có cảm xúc của golfer sau 18 hố — giống hệt cảm xúc của khách khi trả phòng. Tôi không mang golf vào khách sạn. Tôi mang tiêu chuẩn khách sạn vào golf. Đó là lý do tôi làm việc ở GOLF279.

Nhưng sau tất cả, thứ tôi thích nhất không phải là golf hay khách sạn. Thứ tôi thích là hệ thống. Là vận hành. Là giải quyết vấn đề. Tôi thích biến một thứ đang lộn xộn thành một thứ có quy trình, có người chịu trách nhiệm, có checklist, có timeline, có ngân sách và chạy được. Tôi thích ngồi ở giữa — nơi một ý tưởng còn mong manh, nơi mọi người đang bận phần của mình, và cần ai đó đứng ra kết nối tất cả lại để nó thực sự chạy được, lớn lên được và tạo ra giá trị. Người đó thường là tôi. Tôi không nhận mọi dự án. Tôi chỉ làm với những người tôn trọng quy trình, hiểu giá trị của sự chuẩn bị, và muốn đầu tư vào trải nghiệm thật thay vì hình thức. Nếu bạn có một dự án đang kẹt giữa ý tưởng và thực thi, hoặc một việc đang thiếu người làm chủ phần messy middle, chúng ta nên nói chuyện. Tôi không cần một brief hoàn hảo. Tôi chỉ cần một vấn đề thật và sự cho phép để giải quyết nó.`,cv="I didn't start with a 5-star hotel. I started with a small hotel on Bui Vien, and a Korean boss who had just returned from Korea to Vietnam with one belief: do service properly. That year, we didn't have much — just a small building, a few dozen rooms, and a lot of work. I did everything — front desk, room inspection, staying late to rewrite process after a guest complaint. No SOP was pre-printed. SOPs were written from mistakes. My boss is Korean. He didn't talk much about vision. He only talked about end-of-month numbers and whether guests would return. I learned to see a hotel not as a building, but as a breathing P&L. Every missing towel, every late check-in, every not-warm-enough greeting — eventually shows in the last line. 05 years. From Bui Vien we grew to 7 hotels. A-IN HOTEL Vietnam — operated as a system. Not the biggest, but standardized. I went through all roles: night manager, quality supervisor, department lead, finally General Manager — responsible for revenue, cost, and 50 to almost 100 people behind.",fv=`Then I moved to golf. Many ask, why from hotel to golf. For me, there's no difference. By chance, I got to work with my current boss. He is very good and works across many fields — construction, events, business — and had a golf club that needed someone to take care of members. That was my starting point. With a never-give-up, never-satisfied mindset, I kept finding ways to make work better every day. He saw that and supported me a lot. Now I have a small team of teammates who fight together on every project.

A golf tournament, in essence, is a small hotel built in 48 hours. Reception is the check-in desk. Rooms are tee times. There's F&B, caddies like housekeeping, scoring like night audit, and the emotion of a golfer after 18 holes — exactly like a guest checking out. I didn't bring golf into hotels. I brought hotel standards into golf. That's why I work at GOLF279.

But after all, what I love most is not golf or hotels. What I love is system. Operation. Problem solving. I like it when something messy turns into something with a clear owner, a checklist, a timeline and a budget — and it actually runs. I like sitting in the middle — where an idea is still fragile, where everyone is busy with their part, and someone needs to connect everything so it truly works. Not to make it louder, just to make it run a bit smoother than yesterday.`,dv="Ở khách sạn tôi học được hai thứ: một là mọi chi tiết đều có giá, hai là không có trải nghiệm tốt nào tự nhiên mà có. Sau này sang golf, sang sự kiện, sang cả những việc như cho thuê nhà của Leon Home, tôi vẫn mang đúng hai thứ đó theo. Không phải để làm cho to hơn, mà để làm cho nó gọn hơn, rõ hơn, và ít phải sửa lại hơn. Tôi nhận ra mình không thích nói về tầm nhìn lớn. Tôi thích ngồi lại sau giờ, xem hôm nay cái gì vướng, mai sửa một chút, mốt gọn hơn một chút. Cứ thế mà nó thành hệ thống.",pv="In hotels I learned two things: every detail has a cost, and no good experience happens by accident. Later in golf, in events, even in small things like rentals for Leon Home, I carried the same two things with me. Not to make it bigger, but to make it clearer, tighter, and less likely to need fixing twice. I realized I don't like talking about big vision. I like staying late, checking what got stuck today, fixing a little tomorrow, making it a bit tidier the day after. That’s how it becomes a system.";function Sf(e){let n=e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return n=n.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"),n=n.replace(/\*(.+?)\*/g,"<em>$1</em>"),n=n.replace(/\n/g,"<br/>"),n}function Eo(){let[e,n]=T.useState("en"),[t,r]=T.useState("light"),[l,u]=T.useState(0),[i,o]=T.useState(!1),[a,p]=T.useState({x:0,y:0}),[m,g]=T.useState({x:0,y:0}),[h,C]=T.useState(!1),_=T.useRef(null),[P,O]=T.useState(!1),[c,s]=T.useState(""),[v,k]=T.useState("notes"),[E,N]=T.useState([{id:"1" việc học cách làm cho gọn lại.`,workLabel:"Cách tôi làm việc",workSub:"Không phải kiểu giới thiệu dịch vụ. Đây là cách tôi vẫn làm ở nhà mình — nhìn chỗ nào đang rối, tốn, làm khách không quay lại, rồi ngồi xuống viết lại cho nó chạy được.",workIntro:"Tôi không làm việc như một agency. Tôi làm việc như người ở trong nhà, thấy chỗ nào dột thì sửa.",workParas:["Tôi thường bắt đầu bằng cách đứng ở chỗ khách đứng. Ở quầy lễ tân thì nhìn như khách vừa tới mệt. Ở sân golf thì đứng ở bàn check-in lúc 5h30 sáng xem 120 người tới cùng lúc thì vướng gì. Ở nhà cho thuê thì đứng như người thuê lần đầu mở cửa. Xem họ thấy gì trước, rồi mới quay lại xem quy trình.","Sau đó tôi viết lại rất nhỏ: ai làm gì, khi nào, check cái gì, tốn bao nhiêu, nếu sai thì ai chịu. Không có slide đẹp. Chỉ có một checklist chạy được và tên người chịu trách nhiệm rõ. Tôi học từ sếp Hàn Quốc cũ — mọi khăn thiếu, phút check-in trễ, lời chào không đủ ấm, cuối cùng đều hiện ở dòng cuối báo cáo.","Tôi thích ngồi ở giữa — nơi ý tưởng còn mong manh, mọi người đang bận phần của mình, và cần ai đó kết nối lại để nó không rơi. Tôi không cần một brief hoàn hảo. Tôi chỉ cần một vấn đề thật và sự cho phép để giải quyết cho nó gọn hơn ngày hôm qua một chút."],vaultLabel:"Kho Lưu — Second Brain",vaultOutside:"Bên ngoài mọi người có thể đứng ngoài nhìn vào nhà tôi và hiểu về tôi nhưng chỉ có tôi mới biết cách vào nhà và mở cửa",vaultSub:"4 ngăn thật: Ghi chú • Công việc • Lịch trình • Kho ảnh. Local, private, không cloud.",enter:"Vào nhà",keyPlaceholder:"Nhập khóa (279)",wrongKey:"Sai khóa — thử 279",tabs:{notes:"Ghi chú",memo:"Công việc",schedule:"Lịch trình",photo:"Kho ảnh"}},en:{nav:["Home","Story","How I work","Vault \uD83D\uDD12"],heroKicker:"Operation / Hospitality / Golf / MICE",heroTitle:"Le Ha — The person who makes things run when everything is messy.",heroSub:"Started from a small hotel in Bui Vien. Night shifts, room checks, rewriting SOPs after complaints — enough to learn that good operation isn't abou
