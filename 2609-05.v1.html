        .syne { font-family: 'Syne', sans-serif; }

        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-outline {
          -webkit-text-stroke: 1.2px rgba(255,254,251,0.9);
          color: transparent;
        }
        .text-outline-soft {
          -webkit-text-stroke: 1px rgba(255,254,251,0.22);
          color: transparent;
        }

          background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
